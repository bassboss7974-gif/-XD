<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เป็นกำลังใจให้นะ</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eefc;--ink:#1f2a5c;--soft:#5b678f;--card:#ffffff;--sun:#ffb830;--sun2:#ff8a4c;--line:#c9d3f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a38;--ink:#f1f3ff;--soft:#a7b0d8;--card:#1f2750;--line:#34407a}}
:root[data-theme="dark"]{--bg:#141a38;--ink:#f1f3ff;--soft:#a7b0d8;--card:#1f2750;--line:#34407a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.7;min-height:100vh;overflow-x:hidden}
main{max-width:520px;margin:0 auto;padding:28px 20px 48px}
.sky{position:relative;height:150px;overflow:hidden;margin-bottom:8px}
.sun{position:absolute;left:50%;bottom:-70px;width:140px;height:140px;margin-left:-70px;border-radius:50%;
background:radial-gradient(circle,var(--sun),var(--sun2));box-shadow:0 0 60px 20px rgba(255,184,48,.45);transition:bottom .9s cubic-bezier(.2,.8,.2,1)}
.sky.up .sun{bottom:6px}
h1{font-family:Mali,"Noto Sans Thai",sans-serif;font-size:2rem;line-height:1.3;margin:0 0 6px;text-align:center}
.sub{text-align:center;color:var(--soft);margin:0 0 22px}
label{font-weight:600;display:block;margin-bottom:6px}
input{width:100%;font:inherit;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--sun2);outline-offset:2px}
.go{margin-top:16px;width:100%;font:inherit;font-weight:600;font-size:1.1rem;padding:15px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--sun),var(--sun2));color:#3a1d00;cursor:pointer}
.go:active{transform:scale(.98)}
.msg{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;font-family:Mali,"Noto Sans Thai",sans-serif;font-size:1.25rem;line-height:1.8;text-align:center;min-height:120px;display:none}
.msg.show{display:block;animation:pop .45s ease}
.msg{user-select:text;-webkit-user-select:text}
.copy{display:block;margin:12px auto 0;font:inherit;font-weight:600;padding:10px 22px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.copy[hidden]{display:none}
.msg b{color:var(--sun2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sun{transition:none}.msg.show{animation:none}}
</style>
</head>
<body>
<main>
  <div class="sky" id="sky"><div class="sun"></div></div>
  <h1>เป็นกำลังใจให้นะ</h1>
  <p class="sub">บอกมาหน่อยว่ากำลังทำอะไรอยู่ แล้วรับกำลังใจไปเลย</p>

  <label for="task">ตอนนี้กำลังทำอะไรอยู่</label>
  <input id="task" maxlength="60" placeholder="เช่น อ่านหนังสือสอบ" autocomplete="off">
  <button class="go" id="go">ขอกำลังใจหน่อย</button>
  <div class="msg" id="msg" aria-live="polite"></div>
  <button class="copy" id="copy" hidden>คัดลอกข้อความ</button>
</main>
<script>
var M=[
"แค่ที่ได้เริ่ม{t} ก็เก่งกว่าคนที่แค่คิดไว้เยอะแล้ว",
"{t}อาจจะเหนื่อย แต่ทุกก้าวที่ทำวันนี้ คือก้าวที่ใกล้ความสำเร็จขึ้นอีกนิด",
"ไม่ต้องรีบนะ ค่อยๆ {t} ไปทีละนิด สุดท้ายก็ถึงเอง",
"วันไหนที่ไม่อยากทำ แต่ยังเลือก{t}อยู่ วันนั้นแหละที่เก่งที่สุด",
"คุณผ่านวันที่ยากกว่านี้มาแล้ว {t}ก็ผ่านไปได้เหมือนกัน",
"พักได้ ท้อได้ แต่อย่าลืมว่าคุณกำลัง{t}อยู่ และคุณทำได้",
"ไม่มีใครเก่งตั้งแต่แรก ทุกคนที่ชำนาญเรื่อง{t}ก็เคยเริ่มจากศูนย์ทั้งนั้น",
"ความพยายามในการ{t}ของคุณ ไม่เคยสูญเปล่า ถึงตอนนี้จะยังมองไม่เห็นผลก็ตาม",
"ภูมิใจในตัวเองได้เลย เพราะคุณไม่ได้ยอมแพ้ที่จะ{t}",
"เหนื่อยก็หายใจลึกๆ แล้วกลับมา{t}ต่อ เราเชื่อว่าคุณไปต่อได้"
];
var G=["คุณกำลังทำสิ่งที่ตั้งใจอยู่ แค่นี้ก็เก่งมากแล้ว","ทีละก้าวก็พอ ไม่ต้องรีบ คุณกำลังไปถูกทางแล้ว","วันนี้เหนื่อยแค่ไหน คุณก็ยังพยายามอยู่ เป็นกำลังใจให้เสมอ"];
var last=-1,sky=document.getElementById("sky"),box=document.getElementById("msg"),inp=document.getElementById("task");
function give(){
  var t=inp.value.trim(),pool=t?M:G,i;
  do{i=Math.floor(Math.random()*pool.length)}while(i===last&&pool.length>1);
  last=i;
  var s=pool[i];
  if(t){s=s.replace(/\{t\}/g,"<b>"+t.replace(/[&<>]/g,"")+"</b>")}
  box.innerHTML=s;box.classList.remove("show");void box.offsetWidth;box.classList.add("show");
  sky.classList.add("up");
  cp.hidden=false;cp.textContent="คัดลอกข้อความ";
}
var cp=document.getElementById("copy");
cp.onclick=function(){
  var txt=box.textContent;
  function ok(){cp.textContent="คัดลอกแล้ว ✓"}
  function fb(){
    var r=document.createRange();r.selectNodeContents(box);
    var s=getSelection();s.removeAllRanges();s.addRange(r);
    try{document.execCommand("copy");ok()}catch(e){}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fb)}else{fb()}
};
document.getElementById("go").onclick=give;
inp.addEventListener("keydown",function(e){if(e.key==="Enter")give()});
</script>
</body>
</html>
